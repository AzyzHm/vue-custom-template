version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      vue-core:
        patterns:
          - 'vue'
          - 'vue-router'
          - 'pinia'
          - '@vitejs/plugin-vue'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@vue/test-utils'
          - '@testing-library/*'
          - '@playwright/test'
          - 'msw'
      linting:
        patterns:
          - 'eslint'
          - 'eslint-plugin-*'
          - '@vue/eslint-config-*'
          - 'prettier'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
